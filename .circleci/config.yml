version: 2.1
orbs:
  aws-cli: circleci/aws-cli@5.4.1
  slack: circleci/slack@6.1.3

executors:
  node:
    docker:
      - image: khteh/circleci-dotnet:latest

references:
  workspace_root: &workspace_root ~/workspace

  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root

defaults: &defaults # Default directory to run the steps in.
  working_directory: *workspace_root

jobs:
  build_and_test:
    <<: *defaults
    docker:
      - image: khteh/circleci-dotnet:latest
    steps:
      - checkout:
          method: full
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore /p:Version=10.0 --version-suffix $CIRCLE_BUILD_NUM
      - run: dotnet test -c Release --no-restore --no-build test/CinemaReservation.Tests
      - run: dotnet publish -c Release /p:Version=10.0 --version-suffix $CIRCLE_BUILD_NUM -a x64 --os linux src/CinemaConsole
      - setup_remote_docker:
          docker_layer_caching: true
      # use a primary image that already has Docker (recommended)
      # or install it during a build like we do here
      - run:
          name: Extract FileVersion from published binary
          command: |
            exiftool src/CinemaConsole/bin/Release/net10.0/linux-x64/publish/CinemaConsole.dll | grep "File Version" | awk -F":" '{ print $2 }' | xargs echo -n > version.txt
      - run:
          name: Build docker image
          command: |
            MAJOR=$(cat version.txt | awk -F"." '{ print $1 }')
            MINOR=$(cat version.txt | awk -F"." '{ print $2 }')
            VERSION=$MAJOR.$MINOR.$CIRCLE_BUILD_NUM
            docker build -t khteh/cinema-reservation:latest -t khteh/cinema-reservation:$VERSION src
      - run:
          name: Login to docker hub
          command: docker login -u $DOCKER_USER -p $DOCKER_PASS
      - run:
          name: Push images to docker hub
          command: |
            MAJOR=$(cat version.txt | awk -F"." '{ print $1 }')
            MINOR=$(cat version.txt | awk -F"." '{ print $2 }')
            VERSION=$MAJOR.$MINOR.$CIRCLE_BUILD_NUM
            echo ${VERSION} > docker-build_number.txt
            docker push khteh/cinema-reservation --all-tags
      - persist_to_workspace:
          name: Save Workspace
          root: .
          paths:
            - docker-build_number.txt
  deploy-eks:
    executor: aws-cli/default
    <<: *defaults
    steps:
      - *attach_workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-cli/setup:
          profile-name: default
      - run:
          name: Use the saved build number here
          command: |
            echo 'export CIRCLE_BUILD_NUM_DOCKER="$(cat docker-build_number.txt)"' >> $BASH_ENV
            . $BASH_ENV
            echo CIRCLE_BUILD_NUM_DOCKER: $CIRCLE_BUILD_NUM_DOCKER
      - run:
          name: Update Application
          command: |
            #kubectl patch statefulset cinema-reservation --type='json' -p='[{"op": "replace", "path": "/spec/template/spec/containers/0/image", "value":"'$AWS_ACCOUNT_ID'.dkr.ecr.ap-southeast-1.amazonaws.com/cinema-reservation:'$CIRCLE_BUILD_NUM_DOCKER'"}]'
            kubectl set image sts/cinema-reservation cinema-reservation=$AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/cinema-reservation:$CIRCLE_BUILD_NUM_DOCKER
  notification:
    docker:
      - image: "cimg/base:stable"
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS # context / project UI env-var reference
    steps:
      - slack/notify:
          event: fail
          template: basic_fail_1
      - slack/notify:
          event: pass
          template: success_tagged_deploy_1

workflows:
  main:
    jobs:
      - build_and_test
